<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAFAR — Offline Mode</title>
  <style>
    body {
      background-color: #070a12;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      text-align: center;
    }
    .icon { font-size: 64px; margin-bottom: 16px; }
    h1 { color: #14b8a6; margin-bottom: 8px; font-size: 24px; }
    p { color: #cbd5e1; max-width: 360px; line-height: 1.5; margin-bottom: 24px; font-size: 14px; }
    .btn {
      background: linear-gradient(135deg, #0f766e, #14b8a6);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="icon">🚌⚡</div>
  <h1>Offline Mode</h1>
  <p>You are currently offline. SAFAR has saved your recent route schedules, fares, and drafts locally.</p>
  <button class="btn" onclick="window.location.reload()">Retry Connection</button>
</body>
</html>
