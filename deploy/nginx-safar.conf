# ─── Cloudflare Real-IP Restoration (IPv4 + IPv6) ──────────────────────────────
# Ensures $binary_remote_addr reflects the true commuter IP behind Cloudflare proxy
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

real_ip_header CF-Connecting-IP;

# ─── Rate Limiting & Connection Pooling Zones ──────────────────────────────────
# Connection pool generous for shared Carrier-Grade NAT (CG-NAT) mobile towers
limit_conn_zone $binary_remote_addr zone=sse_cg_nat_pool:10m;
limit_req_zone $binary_remote_addr zone=api_global:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=upi_limit:10m rate=12r/m;

# ─── Upstream ────────────────────────────────────────────────────────────────────
upstream safar_backend {
    server 127.0.0.1:3000;
    keepalive 64;
}

# ─── HTTP → HTTPS Redirect ──────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name safar.example.com;
    return 301 https://$host$request_uri;
}

# ─── Main HTTPS Server ──────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name safar.example.com;

    # ─── TLS (Let's Encrypt via Certbot) ─────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/safar.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/safar.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ─── Security Headers ────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ─── Gzip Compression ───────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ─── Static Assets (Cached, served by Nginx directly) ────────────────────
    location /js/ {
        alias /var/www/safar/frontend/js/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /css/ {
        alias /var/www/safar/frontend/css/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /icons/ {
        alias /var/www/safar/frontend/icons/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /manifest.json {
        alias /var/www/safar/frontend/manifest.json;
        expires 1d;
    }

    location /sw.js {
        alias /var/www/safar/frontend/sw.js;
        add_header Cache-Control "no-cache";
    }

    # ─── Prometheus Metrics (Restricted Internal Access) ─────────────────────
    location /metrics {
        proxy_pass http://safar_backend;
        # allow 127.0.0.1;
        # allow 10.0.0.0/8;
        # deny all;
        access_log off;
    }

    # ─── Telemetry Broadcast Endpoint (Driver Ingress Rate Limited) ──────────
    location /api/v1/telemetry/broadcast {
        proxy_pass http://safar_backend;
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        limit_req zone=api_global burst=10 nodelay;
    }

    # ─── SSE Telemetry Stream (CRITICAL: disable proxy buffering) ────────────
    location /api/v1/telemetry/stream {
        proxy_pass http://safar_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        chunked_transfer_encoding off;
        limit_req zone=api_global burst=5;
    }

    # ─── Auth Endpoints (Strict Rate Limit) ──────────────────────────────────
    location /api/v1/auth/ {
        proxy_pass http://safar_backend;
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        limit_req zone=auth_limit burst=2 nodelay;
    }

    location /api/v1/admin/login {
        proxy_pass http://safar_backend;
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        limit_req zone=auth_limit burst=2 nodelay;
    }

    # ─── UPI Payment Endpoints (Moderate Rate Limit) ─────────────────────────
    location /api/v1/trips/upi-intent {
        proxy_pass http://safar_backend;
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        limit_req zone=upi_limit burst=3 nodelay;
    }

    # ─── Health Checks (Unrestricted) ────────────────────────────────────────
    location /healthz {
        proxy_pass http://safar_backend;
        access_log off;
    }

    location /readyz {
        proxy_pass http://safar_backend;
        access_log off;
    }

    # ─── All Other API Routes ────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://safar_backend;
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        limit_req zone=api_global burst=20;
    }

    # ─── SPA Fallback (Frontend) ─────────────────────────────────────────────
    location / {
        root /var/www/safar/frontend;
        try_files $uri $uri/ /index.html;
    }
}
